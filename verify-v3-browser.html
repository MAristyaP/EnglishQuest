<!doctype html><html><head><meta charset="utf-8"><title>EnglishQuest feature checks</title></head><body><pre id="result">WAITING</pre><iframe id="game" title="Feature tests" style="width:1100px;height:900px"></iframe><script>
(async()=>{
 const frame=document.querySelector('#game'),prefix='english-quest-',backup=Object.fromEntries(Object.keys(localStorage).filter(k=>k.startsWith(prefix)).map(k=>[k,localStorage.getItem(k)]));
 const check=(v,m)=>{if(!v)throw Error(m)},sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const load=()=>new Promise(r=>{frame.onload=r;frame.src='index.html?feature-check='+Math.random()});
 const doc=()=>frame.contentDocument,win=()=>frame.contentWindow;
 const click=s=>{const b=doc().querySelector(s);check(b,'Missing '+s);check(!b.disabled,'Disabled '+s);b.click();};
 const waitFor=async(fn,message)=>{for(let i=0;i<100;i++){if(fn())return;await sleep(50)}throw Error(message+': '+doc().querySelector('#record-status')?.textContent+' / '+doc().querySelector('#toast')?.textContent)};
 const state=()=>JSON.parse(localStorage.getItem('english-quest-v1'));
 const set=(s,value)=>doc().querySelector(s).value=value;
 try{
  for(const k of Object.keys(backup))localStorage.removeItem(k);
  await load();check(doc().querySelector('[data-start="adaptive"]'),'Adaptive card missing');click('[data-start="adaptive"]');
  check(doc().querySelector('.quiz-meta').textContent.includes('dari 8'),'Adaptive count');check(doc().querySelector('.adaptive-reason'),'Adaptive reason');
  click('#hint');check(doc().querySelector('#hint-text').textContent.length>20,'Hint absent');click('[data-answer="0"]');check(state().attempts[0].assisted,'Hint not tracked');check(doc().querySelector('.option-reasons'),'Option comparison absent');
  click('[data-page="home"]');click('#discard');
  click('[data-page="story"]');check(doc().querySelectorAll('.chapter').length===18,'Story chapters');check(doc().querySelector('[data-start="story:words:1"]').disabled,'Chapter gate');click('[data-start="story:words:0"]');check(doc().querySelector('.section-head').textContent.includes('Pip'),'Story character');click('[data-page="story"]');click('#discard');
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);const day=yesterday.getFullYear()+'-'+String(yesterday.getMonth()+1).padStart(2,'0')+'-'+String(yesterday.getDate()).padStart(2,'0');const data=state();data.attempts.push({id:'words-1',date:day,correct:false,seconds:10});localStorage.setItem('english-quest-v1',JSON.stringify(data));
  await load();click('[data-page="notebook"]');check(doc().querySelectorAll('.note').length>=1,'Due notebook item');click('[data-start="scheduled"]');check(doc().querySelector('.question'),'Scheduled question');click('[data-page="notebook"]');click('#discard');
  click('[data-page="audio"]');let spoken='';Object.defineProperty(win(),'speechSynthesis',{configurable:true,value:{getVoices:()=>[{name:'Test English',lang:'en-US',localService:true}],speak:u=>spoken=u.text,cancel(){},addEventListener(){}}});Object.defineProperty(win(),'SpeechSynthesisUtterance',{configurable:true,value:class{constructor(text){this.text=text;}}});
  click('[data-start="listening:Explorer"]');check(doc().querySelector('.quiz-meta').textContent.includes('dari 4'),'Listening count');check(!doc().querySelector('#transcript-text').textContent,'Transcript initially visible');click('#listen-play');check(spoken.length>30,'TTS not called: '+doc().querySelector('#toast').textContent+' constructor='+typeof win().SpeechSynthesisUtterance);click('#transcript');check(doc().querySelector('#transcript-text').textContent.length>30,'Transcript missing');click('[data-answer="0"]');check(state().attempts.at(-1).assisted,'Transcript not marked as help');click('[data-page="audio"]');click('#discard');click('[data-page="audio"]');
  // First verify a denied microphone request does not break the page.
  const originalMedia=win().navigator.mediaDevices.getUserMedia.bind(win().navigator.mediaDevices);
  win().navigator.mediaDevices.getUserMedia=()=>Promise.reject(new (win().DOMException)('Denied','NotAllowedError'));
  click('#record-start');await waitFor(()=>doc().querySelector('#record-status').textContent.includes('belum diberikan'),'Microphone denial handling');
  const audioContext=new (win().AudioContext)(),destination=audioContext.createMediaStreamDestination(),oscillator=audioContext.createOscillator();oscillator.connect(destination);oscillator.start();win().navigator.mediaDevices.getUserMedia=async()=>destination.stream;
  click('#record-start');await waitFor(()=>!doc().querySelector('#record-stop').disabled,'Synthetic microphone did not start');await sleep(300);click('#record-stop');await waitFor(()=>doc().querySelector('#record-result audio'),'Recorded playback absent');click('#save-speaking');check(state().speaking.length===1,'Speaking log absent');check(doc().querySelector('#save-speaking').disabled,'Speaking duplicate guard');check(destination.stream.getTracks().every(t=>t.readyState==='ended'),'Microphone tracks not released');audioContext.close();
  const delayedContext=new (win().AudioContext)(),delayedDestination=delayedContext.createMediaStreamDestination();let finishPermission;win().navigator.mediaDevices.getUserMedia=()=>new Promise(resolve=>finishPermission=resolve);click('#record-start');click('[data-page="parents"]');finishPermission(delayedDestination.stream);await waitFor(()=>delayedDestination.stream.getTracks().every(t=>t.readyState==='ended'),'Pending microphone not stopped on navigation');delayedContext.close();check(doc().body.textContent.includes('Potret kemampuan'),'Parent dashboard');check(doc().querySelectorAll('.parent-plan .panel').length===3,'Parent activities');
  click('[data-page="profiles"]');const originalCount=state().attempts.length;set('#profile-name','Nara');set('#profile-avatar','🦊');click('#create-profile');check(doc().querySelector('.profile-card.current').textContent.includes('Nara'),'New profile selection');
  const meta=JSON.parse(localStorage.getItem('english-quest-profiles-v1')),second=meta.profiles.find(p=>p.id===meta.active);check(JSON.parse(localStorage.getItem(second.key)).attempts.length===0,'Profiles mixed');
  click('[data-profile="default"]');check(state().attempts.length===originalCount,'Original progress lost');click('[data-page="profiles"]');
  set('#rename-profile','<img src=x>');click('#rename-save');check(!doc().querySelector('.profile-card img'),'Unsafe profile rendering');set('#rename-profile','Young Explorer');click('#rename-save');
  const fileData={format:'EnglishQuestBackup',version:1,profiles:[{name:'Restored child',avatar:'🐼',data:state()}]},transfer=new (win().DataTransfer)();transfer.items.add(new (win().File)([JSON.stringify(fileData)],'backup.json',{type:'application/json'}));
  const input=doc().querySelector('#restore');input.files=transfer.files;input.dispatchEvent(new (win().Event)('change',{bubbles:true}));await waitFor(()=>doc().querySelector('#restore-status').textContent.includes('1 profil dipulihkan'),'Import did not finish');check(doc().querySelectorAll('.profile-card').length===3,'Restored profile missing');check(state().attempts.length===originalCount,'Restore overwrote original');
  const invalid=new (win().DataTransfer)();invalid.items.add(new (win().File)(['{"format":"wrong"}'],'bad.json',{type:'application/json'}));const restore=doc().querySelector('#restore');restore.files=invalid.files;restore.dispatchEvent(new (win().Event)('change',{bubbles:true}));await waitFor(()=>doc().querySelector('#restore-status').textContent.includes('belum dipulihkan'),'Invalid import not rejected');check(doc().querySelectorAll('.profile-card').length===3,'Invalid import mutated profiles');
  document.querySelector('#result').textContent='PASS: adaptive UI, hints, story gates, scheduled notebook, listening TTS/transcript, microphone denial, synthetic recording/playback/log, parent dashboard, isolated profiles, safe names, JSON restore and invalid-file rejection';
 }catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;}
 finally{frame.remove();for(const key of Object.keys(localStorage))if(key.startsWith(prefix))localStorage.removeItem(key);for(const [k,v]of Object.entries(backup))localStorage.setItem(k,v);}
})();
</script></body></html>
