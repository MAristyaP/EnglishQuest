<!doctype html><meta charset="utf-8"><title>EnglishQuest v8 checks</title><pre id="result">WAITING</pre><iframe id="game" style="width:1100px;height:1200px"></iframe><script>
(async()=>{
const frame=document.querySelector('#game'),prefix='english-quest-',backup=Object.fromEntries(Object.keys(localStorage).filter(k=>k.startsWith(prefix)).map(k=>[k,localStorage.getItem(k)]));
const check=(ok,m)=>{if(!ok)throw Error(m)},load=()=>new Promise(r=>{frame.onload=r;frame.src='index.html?v8test='+Math.random()}),doc=()=>frame.contentDocument,w=()=>frame.contentWindow;
const click=s=>{const e=doc().querySelector(s);check(e&&!e.disabled,'Unavailable '+s);e.click()},change=(s,v)=>{doc().querySelector(s).value=v;doc().querySelector(s).dispatchEvent(new (w().Event)('change',{bubbles:true}))},state=()=>JSON.parse(localStorage.getItem('english-quest-v1'));
try{
 for(const k of Object.keys(backup))localStorage.removeItem(k);await load();
 click('[data-page="dictionary"]');check(doc().querySelectorAll('.word-card').length===6,'Not six daily words');const ids=[...doc().querySelectorAll('[data-save-word]')].map(b=>b.dataset.saveWord);await load();click('[data-page="dictionary"]');check(ids.join()===Array.from(doc().querySelectorAll('[data-save-word]'),b=>b.dataset.saveWord).join(),'Daily changed on refresh');
 let s=state()||w().eval('EQ').blank(),words=w().eval('QUEST_WORDS'),eq=w().eval('EQ'),today=eq.dateKey(new Date()),first=eq.addDays(today,-3);s.lexicon.saved=words.map(x=>({id:x.id,date:today}));s.attempts=[{id:'words-1',date:first,correct:false,seconds:20,mode:'daily'},{id:'words-2',date:first,correct:false,seconds:20,mode:'daily'}];localStorage.setItem('english-quest-v1',JSON.stringify(s));await load();click('[data-page="dictionary"]');change('#word-filter','saved');check(doc().querySelectorAll('.word-card').length===6,'Saved list not paginated');click('[data-word-page="1"]');check(doc().querySelector('.word-pagination').textContent.includes('2 / 4'),'Pagination failed');
 click('[data-page="progress"]');click('[data-start="recap:'+first+'"]');check(doc().querySelectorAll('[data-answer]').length===4,'Recap not playable');const opts=doc().querySelector('.options'),confidence=doc().querySelector('.student-tools');check(!!(opts.compareDocumentPosition(confidence)&4),'Confidence above options');check(parseFloat(w().getComputedStyle(doc().querySelector('.question')).fontSize)>=24,'Small prompt');check(parseFloat(w().getComputedStyle(doc().querySelector('.option')).fontSize)>=19,'Small options');
 frame.style.width='390px';await new Promise(r=>setTimeout(r,100));check(doc().documentElement.scrollWidth<=doc().documentElement.clientWidth,'Mobile overflow');
 while(state().active){const a=state().active,q=w().eval('QUESTIONS').find(q=>q.id===a.questionIds[a.index]);click('[data-answer="'+q.answer+'"]');click('#next');}click('[data-page="progress"]');change('#accuracy-scope','recap');check(doc().querySelector('#app').textContent.includes('2 percobaan · 100% benar'),'Recap accuracy not separated');
 click('[data-page="parents"]');let pdf=null;w().URL.createObjectURL=b=>{pdf=b;return 'blob:test'};w().HTMLAnchorElement.prototype.click=function(){};click('#download-parent-pdf');check(pdf&&pdf.type==='application/pdf','PDF download absent');const bytes=new Uint8Array(await pdf.arrayBuffer()),raw=new TextDecoder('latin1').decode(bytes);check(raw.startsWith('%PDF-1.4'),'Invalid PDF header');check(raw.includes('/DCTDecode'),'Missing report images');check(raw.includes('/Subtype /Link')&&raw.includes('/S /GoTo'),'Missing clickable navigation');check((raw.match(/\/Subtype \/Link/g)||[]).length===(raw.match(/\/Type \/Page /g)||[]).length*3,'Wrong navigation count');check((raw.match(/\/Type \/Page /g)||[]).length>=2,'Missing PDF pagination');const xref=Number(raw.match(/startxref\n(\d+)/)[1]);check(new TextDecoder().decode(bytes.slice(xref,xref+4))==='xref','Invalid PDF offsets');
 check(w().eval('questReportPages')(eq.blank(),'Profil baru',today,w().eval('QUESTIONS'),w().eval('TOPICS')).length===3,'Empty report failed');const archive=eq.blank();for(let i=0;i<8;i++)archive.attempts.push({id:'words-1',date:eq.addDays(today,-i*3),correct:false,seconds:1,mode:'daily'});check(w().eval('questReportPages')(archive,'Arsip',today,w().eval('QUESTIONS'),w().eval('TOPICS')).length===4,'Archive pages failed');document.querySelector('#result').textContent='PASS: six daily words, reload stability, saved pagination, three-day recap completion, confidence placement, readable fonts, mobile layout, separate accuracy, downloadable multipage PDF with valid xref.';
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;}
finally{for(const k of Object.keys(localStorage).filter(k=>k.startsWith(prefix)))localStorage.removeItem(k);for(const [k,v] of Object.entries(backup))localStorage.setItem(k,v);}
})();</script>
