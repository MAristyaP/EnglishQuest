<!doctype html><html><meta charset="utf-8"><title>Interactive workshop checks</title><pre id="result">WAITING</pre><iframe id="game" style="width:1100px;height:1000px"></iframe><script>
(async()=>{
 const frame=document.querySelector('#game'),prefix='english-quest-',backup=Object.fromEntries(Object.keys(localStorage).filter(k=>k.startsWith(prefix)).map(k=>[k,localStorage.getItem(k)]));
 const check=(v,m)=>{if(!v)throw Error(m)},sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const load=()=>new Promise(r=>{frame.onload=r;frame.src='index.html?workshop-check='+Math.random()});
 const doc=()=>frame.contentDocument,w=()=>frame.contentWindow,click=s=>{const b=doc().querySelector(s);check(b,'Missing '+s);check(!b.disabled,'Disabled '+s);b.click();};
 const state=()=>JSON.parse(localStorage.getItem('english-quest-v1')),q=()=>w().eval('QUESTIONS').find(q=>q.id===state().active.questionIds[state().active.index]),task=()=>w().eval('ACTIVE_TASKS')[q().id],I=()=>w().eval('Interactive');
 const input=(s,value)=>{doc().querySelector(s).value=value;doc().querySelector(s).dispatchEvent(new (w().Event)('input',{bubbles:true}));};
 const change=(s,value)=>{doc().querySelector(s).value=value;doc().querySelector(s).dispatchEvent(new (w().Event)('change',{bubbles:true}));};
 function solve(){const t=task();if(!t){click('[data-answer="'+q().answer+'"]');return;}
  if(t.kind==='order')for(let i=0;i<t.tokens.length;i++)if(!state().active.interactiveDraft.order.includes(i))click('[data-token-add="'+i+'"]');
  if(t.kind==='evidence'){click('[data-evidence-answer="'+q().answer+'"]');click('[data-proof="'+t.proof+'"]');}
  if(t.kind==='edit'){click('[data-edit-part="'+t.bad+'"]');click('[data-edit-replacement="'+t.repair+'"]');}
  if(t.kind==='dialogue'){let node=I().nodeFor(t,state().active.interactiveDraft.path),guard=0;while(node&&guard++<5){click('[data-dialogue-choice="'+t.nodes[node].choices.findIndex(c=>c.good)+'"]');node=I().nodeFor(t,state().active.interactiveDraft.path);}check(guard<5,'Dialogue loop');}
  click('#activity-submit');
 }
 function finish(){let guard=0;while(state().active&&guard++<40){if(!state().active.answered)solve();click('#next');}check(guard<40,'Finish loop');}
 try{
  for(const k of Object.keys(backup))localStorage.removeItem(k);await load();check(doc().querySelector('.workshop-invite'),'Home entry absent');click('[data-page="workshop"]');change('#workshop-level','Champion');check(doc().querySelector('[data-start="play:order:Champion"]'),'Level did not change mode');change('#workshop-level','Explorer');click('[data-start="play:order:Explorer"]');check(doc().querySelector('.interaction-zone'),'Order UI missing');check(!doc().querySelector('[data-answer]'),'Order still multiple choice');
  click('#activity-submit');check(doc().querySelector('#activity-error').textContent.length>15,'Incomplete order accepted');click('[data-token-add="0"]');check(state().active.interactiveDraft.order[0]===0,'Token not persisted');await load();click('#resume');check(state().active.interactiveDraft.order.length===1,'Reload lost order draft');click('[data-token-remove="0"]');check(!state().active.interactiveDraft.order.length,'Undo failed');
  frame.style.width='390px';await sleep(100);check(doc().documentElement.scrollWidth<=doc().documentElement.clientWidth,'Order mobile overflow');solve();check(state().attempts.at(-1).correct,'Correct order marked wrong');check(doc().querySelector('#activity-submit').disabled,'Order not locked');finish();check(doc().querySelector('.reflection-form'),'Interactive session missing student survey');check(state().runs.at(-1).total===3,'Order run wrong size');
  click('[data-page="workshop"]');click('[data-start="play:evidence:Explorer"]');click('[data-evidence-answer="'+q().answer+'"]');click('[data-proof="'+((task().proof+1)%3)+'"]');click('#activity-submit');check(!state().attempts.at(-1).correct,'Wrong evidence accepted');check(doc().querySelector('#feedback').textContent.includes('Jawaban tepat; bukti belum tepat'),'Separate evidence feedback absent');finish();
  click('[data-page="workshop"]');click('[data-start="play:edit:Explorer"]');click('[data-edit-part="'+task().bad+'"]');await load();click('#resume');check(state().active.interactiveDraft.part===task().bad,'Reload lost edit selection');check(doc().documentElement.scrollWidth<=doc().documentElement.clientWidth,'Editor overflow');finish();
  click('[data-page="workshop"]');click('[data-start="play:dialogue:Explorer"]');const bad=task().nodes.start.choices.findIndex(c=>!c.good);click('[data-dialogue-choice="'+bad+'"]');check(I().nodeFor(task(),state().active.interactiveDraft.path)==='repair','Response did not branch');check(doc().querySelector('[data-confidence]').disabled,'Dialogue confidence not locked');await load();click('#resume');check(state().active.interactiveDraft.path.length===1,'Reload lost dialogue path');check(doc().querySelector('[data-confidence]').disabled,'Reload unlocked dialogue confidence');finish();check(!state().attempts.at(-1).correct,'Repair path erased first response');check(doc().body.textContent.includes('Could I borrow a book'),'Dialogue result lost transcript');
  click('[data-page="dictionary"]');click('[data-save-word="lexicon-soil"]');check(state().lexicon.saved.some(s=>s.id==='lexicon-soil'),'Word not saved');input('#custom-word','<img src=x>');input('#custom-meaning','Makna <b>pribadi</b>');input('#custom-example','A literal <b>example</b>.');change('#custom-picture','family');click('#add-custom-word');check(state().lexicon.custom.length===1,'Custom word not saved');check(state().lexicon.custom[0].picture==='family','Custom illustration not saved');check(!doc().querySelector('.word-card img[src="x"]'),'Custom word rendered HTML');const personal=state().lexicon.custom[0].id,before=state().attempts.length;click('[data-flash-word="'+personal+'"]');click('#flash-reveal');click('[data-flash-grade="yes"]');check(state().lexicon.reviews.at(-1).type==='self','Self review absent');check(state().attempts.length===before,'Flashcard invented scored attempt');await load();click('[data-page="dictionary"]');check(state().lexicon.custom.length===1,'Reload lost custom dictionary');
  click('[data-start="play:words"]');check(q().wordId==='lexicon-soil','Saved-word quiz scope wrong');click('[data-word-meaning="lexicon-soil"]');click('[data-answer="'+q().answer+'"]');check(state().attempts.at(-1).assisted,'Meaning not counted as assistance');check(state().lexicon.reviews.at(-1).type==='quiz','Vocabulary quiz review absent');click('#next');
  click('[data-page="workshop"]');click('[data-start="play:daily:Explorer"]');check(state().active.questionIds.length===5,'Interactive daily size');check(new Set(state().active.questionIds.map(id=>w().eval('QUESTIONS').find(q=>q.id===id).activity).filter(Boolean)).size===4,'Daily lacks mode variety');finish();
  let s=state(),eq=w().eval('EQ'),today=eq.dateKey(new Date());for(let i=0;i<7;i++)s.attempts.push({id:'words-1',correct:true,date:eq.addDays(today,-i),seconds:10});localStorage.setItem('english-quest-v1',JSON.stringify(s));await load();click('[data-page="missions"]');click('[data-start="exam"]');s=state();const first=w().eval('QUESTIONS').find(x=>x.activity&&x.level===q().level&&!s.active.questionIds.includes(x.id));s.active.questionIds[0]=first.id;localStorage.setItem('english-quest-v1',JSON.stringify(s));await load();click('#resume');check(doc().querySelectorAll('[data-answer]').length===4,'Exam format changed');check(!doc().querySelector('.interaction-zone'),'Exam exposed interactive mode');check(!doc().querySelector('.word-tools'),'Exam exposed word help');click('[data-answer="0"]');check(!doc().querySelector('#feedback').textContent.includes('Jawaban:'),'Exam answer leaked');
  document.querySelector('#result').textContent='PASS: four interactive UIs, level selection, draft reload, undo, component scoring, branching transcript, result survey, dictionary/custom words, safe text, flashcards, assisted word quiz, mixed daily, mobile layout, unchanged exam format';
 }catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;}
 finally{for(const k of Object.keys(localStorage).filter(k=>k.startsWith(prefix)))localStorage.removeItem(k);for(const [k,v] of Object.entries(backup))localStorage.setItem(k,v);}
})();
</script></html>
